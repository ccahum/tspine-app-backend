# Producción — DigitalOcean (backend + postgres juntos)
# Uso: docker compose -f docker-compose.prod.yml up -d
# Variables requeridas en .env.prod (ver .env.prod.example)
services:
  backend:
    build: .
    image: tspine-backend
    container_name: tspine-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tspine:${POSTGRES_PASSWORD}@postgres:5432/tspine_db
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tspine-net

  postgres:
    image: postgres:16-alpine
    container_name: tspine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tspine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tspine_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tspine -d tspine_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tspine-net

volumes:
  pgdata:

networks:
  tspine-net:
    driver: bridge
