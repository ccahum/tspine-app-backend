name: Deploy to QA

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/luminar-tspine-qa/backend
            git pull origin dev
            docker compose -p qa --env-file .env.qa -f docker-compose.app.yml -f docker-compose.qa-imports-override.yml up -d --build
